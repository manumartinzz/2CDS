<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcquaSafe – Administração</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-bg">

    <header class="glass-card header-admin">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center">
                <i data-lucide="shield" class="w-5 h-5 text-white"></i>
            </div>
            <h1 class="gradient-text text-xl font-bold">AcquaSafe – Administração</h1>
        </div>
        <button class="btn-gradient" onclick="sair()">Sair</button>
    </header>

    <!-- Hub real: aponta para as telas administrativas que usam Supabase.
         Antes esta página exibia listas fictícias em memória e um login
         baseado em localStorage.adminLogado (que nunca era setado). -->
    <main class="dashboard">

        <section class="glass-card painel">
            <h2>Clientes</h2>
            <p class="text-sm text-white/60 mb-4">Cadastro, planos e situação de cada cliente.</p>
            <a href="admin-clientes.html" class="btn-gradient inline-block">Abrir lista de clientes</a>
        </section>

        <section class="glass-card painel">
            <h2>Gerenciar Doenças</h2>
            <p class="text-sm text-white/60 mb-4">Catálogo de patógenos exibido no portal.</p>
            <a href="admin-doencas.html" class="btn-gradient inline-block">Gerenciar catálogo</a>
        </section>

        <section class="glass-card painel">
            <h2>Bloqueios</h2>
            <p class="text-sm text-white/60 mb-4">Suspender ou restaurar o acesso de contas.</p>
            <a href="admin-bloqueios.html" class="btn-gradient inline-block">Gerenciar bloqueios</a>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="admin-guard.js"></script>
    <script src="admin.js"></script>
</body>
</html>
